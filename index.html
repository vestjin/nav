<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人导航</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="logo">🚀</span>
      <h1>个人导航</h1>
      <span id="totalCount" class="total-count" title="共 0 项书签">0</span>
    </div>
    <div class="header-actions">
      <button id="addBtn" class="icon-btn" title="添加书签" aria-label="添加书签">＋</button>
      <button id="refreshBtn" class="icon-btn" title="重新抓取所有书签的标题和图标" aria-label="刷新元数据">⟳</button>
      <button id="importBtn" class="icon-btn" title="从 JSON 导入" aria-label="导入">⬇</button>
      <button id="exportBtn" class="icon-btn" title="导出为 JSON" aria-label="导出">⬆</button>
      <span id="syncIndicator" class="sync-indicator" title=""></span>
      <button id="syncBtn" class="icon-btn" title="云同步设置" aria-label="云同步">☁</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-title">分组</div>
      <nav id="categoryNav" class="category-nav" aria-label="书签分组"></nav>
      <button id="manageGroupBtn" class="sidebar-manage-btn">管理分组</button>
    </aside>

    <main class="main">
      <div class="clock-wrap" id="clockToggle" title="点击隐藏书签，进入专注模式">
        <div id="clockDisplay" class="clock-time">00:00:00</div>
        <div id="clockDate" class="clock-date"></div>
      </div>

      <form id="webSearch" class="search-bar" autocomplete="off">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="searchInput" type="search" placeholder="搜索书签，回车搜索网页…" aria-label="搜索" />
        <button type="button" id="clearSearch" class="clear-btn hidden" title="清除" aria-label="清除搜索">✕</button>
        <select id="webEngine" title="搜索引擎" aria-label="搜索引擎">
          <option value="bing">Bing</option>
          <option value="google">Google</option>
          <option value="duckduckgo">DuckDuckGo</option>
          <option value="yandex">Yandex</option>
        </select>
        <button type="submit" class="search-go" title="搜索网页" aria-label="搜索网页">→</button>
      </form>

      <div class="current-group">
        <h2 id="currentGroupName">全部书签</h2>
        <span id="currentGroupCount" class="group-count">0 项</span>
      </div>

      <div id="navContainer" class="nav-container"></div>
    </main>
  </div>

  <footer class="footer">
    <div>©2022 - <span id="year"></span> 个人导航 · 部署在 GitHub Pages</div>
    <div>数据自动抓取 · 本地存储</div>
  </footer>

  <div id="toast" class="toast hidden"></div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2 id="modalTitle">添加书签</h2>
      <form id="bookmarkForm">
        <label>名称 <input id="bmName" type="text" placeholder="留空自动抓取页面标题" /></label>
        <label>网址 <span class="required">*</span> <input id="bmUrl" type="url" placeholder="https://example.com" required /></label>
        <label>分类 <input id="bmCategory" type="text" placeholder="例如：常用" list="categoryList" /></label>
        <datalist id="categoryList"></datalist>
        <label>图标 URL（可选） <input id="bmIcon" type="url" placeholder="https://…" /></label>
        <input id="bmId" type="hidden" />
        <div class="modal-actions">
          <button type="button" id="cancelBtn" class="btn ghost">取消</button>
          <button type="submit" class="btn primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2>云同步设置</h2>
      <p class="settings-hint">
        使用 GitHub Gist 跨设备同步书签。
        <a href="https://github.com/settings/tokens/new?scopes=gist&description=Personal%20Nav%20Sync" target="_blank" rel="noopener">创建 Token（仅需 Gists 权限）</a>
        · 留空 Gist ID 时使用代码内置的默认 ID。
      </p>
      <form id="settingsForm">
        <label>GitHub Token <input id="ghToken" type="password" placeholder="ghp_…" autocomplete="off" /></label>
        <label>Gist ID <input id="ghGistId" type="text" placeholder="留空将自动创建" autocomplete="off" /></label>
        <label class="checkbox-label"><input id="enableSync" type="checkbox" /> 启用云同步</label>
        
        <div style="border-top: 1px solid var(--border); margin: 16px 0; padding-top: 16px;">
          <p class="settings-hint" style="margin-bottom: 8px;">填写自建的 Cloudflare Worker 代理地址，可彻底解决国内抓取标题慢/失败的问题。（留空则使用公共代理）</p>
          <label>抓取代理地址 <input id="proxyUrl" type="text" placeholder="https://your-worker.workers.dev/?url=" autocomplete="off" /></label>
        </div>

        <div id="syncStatus" class="sync-status">未配置</div>
        <div class="modal-actions settings-actions">
          <button type="button" id="pullNow" class="btn ghost">⬇ 拉取</button>
          <button type="button" id="pushNow" class="btn ghost">⬆ 推送</button>
          <button type="button" id="cancelSettings" class="btn ghost">关闭</button>
          <button type="submit" class="btn primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="groupModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2>分组管理</h2>
      <p class="settings-hint">直接修改名称即可重命名分组（按回车或点击空白处生效）。删除分组会将组内书签移至“未分类”。</p>
      <div id="groupList" class="group-list"></div>
      <div class="modal-actions">
        <button type="button" id="cancelGroup" class="btn primary">关闭</button>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
